name: fernche
description: "Fernche - Financial Ledger & Repository"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  provider: ^6.1.4
  fl_chart: ^0.70.2
  pattern_formatter: ^4.0.1
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  excel: ^4.0.6
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.1"

flutter:
  uses-material-design: true
  assets:
    - assets/logo-hitam.png
    - assets/logo-putih.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo-hitam.png"
  min_sdk_android: 21
